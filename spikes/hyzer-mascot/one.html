<!doctype html><meta charset="utf-8"><title>One Hyzer</title><body style="margin:0;background:#fffdf8"><div id="h" style="width:64px;height:64px"></div>
<script type="module">
// One live Hyzer at the panel-heading size, for the frame-cost measurement in capture-cost.mjs.
import {mount, Mascot} from '../../public/vendor/wobnimo/wobnimo-0.2.0.js';
import hyzer from '../../public/hyzer.mjs';
const tick = Mascot.prototype.tick; window.cost = [];
Mascot.prototype.tick = function (...a) {const t = performance.now(); tick.apply(this, a); window.cost.push(performance.now() - t);};
window.mascot = mount(document.getElementById('h'), hyzer, {state: new URLSearchParams(location.search).get('state') || 'idle', floor: 0.35, framing: 0.9});
</script>
