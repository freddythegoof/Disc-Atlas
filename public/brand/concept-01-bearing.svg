      .brand-concept { --brand-ink:#edf2fc; --brand-secondary:#97a3b5; --brand-accent:#b8ff00; --brand-surface:#080b10; }
    }
  </style>
  <g>
      <circle cx="0" cy="0" r="58" fill="none" stroke="var(--brand-ink, #202731)" stroke-width="6"/>
      <circle cx="0" cy="0" r="44" fill="none" stroke="var(--brand-ink, #202731)" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.6"/>
      <line x1="0" y1="-72" x2="0" y2="-58" stroke="var(--brand-accent, #4d7c0f)" stroke-width="4.5" stroke-linecap="round"/>
