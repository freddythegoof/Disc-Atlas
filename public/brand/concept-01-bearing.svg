      <line x1="-70" y1="0" x2="-58" y2="0" stroke="var(--brand-ink, #202731)" stroke-width="3" stroke-linecap="round"/>
      <line x1="58" y1="0" x2="70" y2="0" stroke="var(--brand-ink, #202731)" stroke-width="3" stroke-linecap="round"/>
      <path d="M 0,-52 L 15, -4 L 0, -14 L -15, -4 Z" fill="var(--brand-accent, #4d7c0f)"/>
      <path d="M 0, -14 L 14, 38 L 0, 24 L -14, 38 Z" fill="var(--brand-secondary, #687384)"/>
      <circle cx="0" cy="-6" r="4.5" fill="var(--brand-surface, #f7f8fa)" stroke="var(--brand-ink, #202731)" stroke-width="2.5"/>
      <circle cx="0" cy="-6" r="2" fill="var(--brand-accent, #4d7c0f)"/>

