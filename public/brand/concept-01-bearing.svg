<svg xmlns="http://www.w3.org/2000/svg" class="brand-concept" viewBox="-80 -80 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Atlas / Compass Rose — Disc Atlas concept 1</title>
  <desc id="desc">A calibrated disc rim, cardinal ticks, and a two-part compass needle make navigation the central idea.</desc>
  <!-- Revised from Freddy's supplied vector reference. Geometry is editable. -->
  <!-- Inline consumers may override the four brand color properties per theme. -->
  <style>
    .brand-concept { --brand-ink:#202731; --brand-secondary:#687384; --brand-accent:#4d7c0f; --brand-surface:#f7f8fa; }
