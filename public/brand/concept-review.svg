</g>
</g>
<g>
  <rect x="48" y="604" width="306" height="218" rx="12" fill="#11151c" stroke="#282f3a"/>
  <text x="72" y="638" class="number">CONCEPT 03</text>
  <text x="72" y="669" class="name">Disc + Scatter Atlas</text>
  <text x="72" y="708" class="idea"><tspan x="72" dy="0">Speed and stability axes, clustered</tspan><tspan x="72" dy="22">discs, and a highlighted node turn</tspan><tspan x="72" dy="22">the disc into the atlas itself.</tspan></text>
  <text x="72" y="797" class="number">MARK STUDY / FOR REVIEW</text>
  <g style="--brand-ink:#202731;--brand-secondary:#687384;--brand-accent:#4d7c0f;--brand-surface:#f7f8fa">
