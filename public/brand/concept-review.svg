  <text x="922" y="154" class="theme" fill="#97a3b5">MIDNIGHT</text>
  <use href="#mark-0" x="949" y="169.5" width="160" height="160"/>
</g>
</g>
<g>
  <rect x="48" y="366" width="306" height="218" rx="12" fill="#11151c" stroke="#282f3a"/>
  <text x="72" y="400" class="number">CONCEPT 02</text>
  <text x="72" y="431" class="name">Flight-Path S-Curve</text>
  <text x="72" y="470" class="idea"><tspan x="72" dy="0">An outlined disc, continuous flight</tspan><tspan x="72" dy="22">trace, and waypoints give the mark</tspan><tspan x="72" dy="22">the reference’s sense of motion.</tspan></text>
  <text x="72" y="559" class="number">MARK STUDY / FOR REVIEW</text>
  <g style="--brand-ink:#202731;--brand-secondary:#687384;--brand-accent:#4d7c0f;--brand-surface:#f7f8fa">
  <rect x="374" y="366" width="246" height="218" rx="12" fill="#f7f8fa" stroke="#dfe3e9"/>
  <text x="390" y="392" class="theme" fill="#687384">LIGHT</text>
  <use href="#mark-1" x="417" y="407.5" width="160" height="160"/>
</g>
<g style="--brand-ink:#f4f7fa;--brand-secondary:#a6b3c4;--brand-accent:#b8ff00;--brand-surface:#0c1014">
  <rect x="640" y="366" width="246" height="218" rx="12" fill="#0c1014" stroke="#282f3a"/>
  <text x="656" y="392" class="theme" fill="#a6b3c4">DARK</text>
  <use href="#mark-1" x="683" y="407.5" width="160" height="160"/>
</g>
<g style="--brand-ink:#edf2fc;--brand-secondary:#97a3b5;--brand-accent:#b8ff00;--brand-surface:#080b10">
  <rect x="906" y="366" width="246" height="218" rx="12" fill="#080b10" stroke="#282f3a"/>
  <text x="922" y="392" class="theme" fill="#97a3b5">MIDNIGHT</text>
