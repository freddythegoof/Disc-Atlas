  <text x="656" y="154" class="theme" fill="#a6b3c4">DARK</text>
  <use href="#mark-0" x="683" y="169.5" width="160" height="160"/>
</g>
<g style="--brand-ink:#edf2fc;--brand-secondary:#97a3b5;--brand-accent:#b8ff00;--brand-surface:#080b10">
