  <title id="title">Disc Atlas — revised concept marks</title>
  <desc id="desc">Three instrument-style mark concepts adapted from Freddy's SVG reference. Compass, flight path, and scatter atlas each appear on light, dark, and midnight backgrounds.</desc>
