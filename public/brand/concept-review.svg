    </g></symbol></defs><style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:27px;font-weight:600;fill:#f1f5f9}.phase{font-size:11px;letter-spacing:1.5px;fill:#b8ff00}.intro{font-size:14px;fill:#a6b3c4}.number{font-size:11px;letter-spacing:1.5px;fill:#b8ff00}.name{font-size:20px;font-weight:600;fill:#f1f5f9}.idea{font-size:14px;fill:#a6b3c4}.theme{font-size:10px;letter-spacing:1px}.footer{font-size:12px;fill:#a6b3c4}</style>
  <rect width="1200" height="900" fill="#090b10"/>
  <text x="48" y="49" class="title">DISC ATLAS / MARK CONCEPTS</text>
  <text x="1152" y="47" text-anchor="end" class="phase">PHASE 01 · REFERENCE REVISION</text>
  <text x="48" y="80" class="intro">Calibrated geometry, flight traces, and scatter detail. Kinetic lime accent; no wordmarks yet.</text>
  <g>
  <rect x="48" y="128" width="306" height="218" rx="12" fill="#11151c" stroke="#282f3a"/>
  <text x="72" y="162" class="number">CONCEPT 01</text>
  <text x="72" y="193" class="name">Atlas / Compass Rose</text>
  <text x="72" y="232" class="idea"><tspan x="72" dy="0">A calibrated disc rim, cardinal ticks,</tspan><tspan x="72" dy="22">and a two-part compass needle</tspan><tspan x="72" dy="22">make navigation the central idea.</tspan></text>
  <text x="72" y="321" class="number">MARK STUDY / FOR REVIEW</text>
  <g style="--brand-ink:#202731;--brand-secondary:#687384;--brand-accent:#4d7c0f;--brand-surface:#f7f8fa">
  <rect x="374" y="128" width="246" height="218" rx="12" fill="#f7f8fa" stroke="#dfe3e9"/>
  <text x="390" y="154" class="theme" fill="#687384">LIGHT</text>
  <use href="#mark-0" x="417" y="169.5" width="160" height="160"/>
</g>
<g style="--brand-ink:#f4f7fa;--brand-secondary:#a6b3c4;--brand-accent:#b8ff00;--brand-surface:#0c1014">
