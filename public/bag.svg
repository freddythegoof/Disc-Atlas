<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" fill="none" role="img" aria-labelledby="bag-title bag-description" data-state="closed">
  <title id="bag-title">Premium disc golf bag</title>
  <desc id="bag-description">An empty premium disc golf bag with a large front disc compartment. The front access flap unzips around its sides and bottom, folds inward from its top attachment, and secures behind the discs. The smaller upper putter pocket remains fixed.</desc>
  <style>
    /* Palette defaults live only here. Override these classes or the three CSS
       variables on the inline SVG. All visible fabric uses semantic classes. */
    .bag-primary { fill: var(--bag-primary, #343c49); }
    .bag-secondary { fill: var(--bag-secondary, #202630); }
    .bag-accent { fill: var(--bag-accent, #718091); }
    .bag-seam { fill: none; stroke: var(--bag-accent, #718091); stroke-width: 1.25; stroke-dasharray: 2 3; opacity: .56; }
    .bag-piping { fill: none; stroke: var(--bag-accent, #718091); stroke-width: 2.5; }
    .bag-fold { fill: none; stroke: var(--bag-secondary, #202630); stroke-width: 2; }

  
    /* The tucked copy is painted in bag-back, behind application discs. */
    #tucked-front-flap { display: none; }
    [data-state="open"] #tucked-front-flap { display: inline; }
    [data-state="open"] #bag-lid { display: none; }
</style>
  <defs>
