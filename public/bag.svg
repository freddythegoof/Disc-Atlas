      <stop stop-color="white" stop-opacity="0" />
      <stop offset=".65" stop-color="white" stop-opacity=".12" />
      <stop offset="1" stop-color="white" stop-opacity=".9" />
    </linearGradient>
    <linearGradient id="light-down" x2="0" y2="1">
      <stop stop-color="white" stop-opacity=".5" />
      <stop offset=".5" stop-color="white" stop-opacity=".04" />
      <stop offset="1" stop-color="white" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="shade-across">
      <stop stop-color="white" stop-opacity=".9" />
      <stop offset=".3" stop-color="white" stop-opacity="0" />
      <stop offset=".75" stop-color="white" stop-opacity="0" />
      <stop offset="1" stop-color="white" stop-opacity=".85" />
    </linearGradient>
    <mask id="soft-bottom" maskContentUnits="objectBoundingBox">
      <path d="M0 0H1V1H0Z" fill="url(#shade-down)" />
    </mask>
    <mask id="soft-top" maskContentUnits="objectBoundingBox">
