# Manual production deploy. Runs only when someone presses "Run workflow";
# pushes never deploy, so the QA-then-deploy gate stays in place.
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a second dispatch waits for the first to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # "Run workflow" offers a branch picker; only main ships.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: https://disc-atlas-public.disc-atlas-explorer.workers.dev
    steps:
      # Actions are pinned to commit SHAs so a moved tag can't change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # corepack honors packageManager (pnpm@11.25.0) in package.json.
      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build workers
        run: pnpm build:workers

      # build:workers runs in the step right before this one, so the
      # bundle that ships is the one built from this checkout.
      - name: Deploy workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The CLOUDFLARE_API_TOKEN repository secret is not set."
            exit 1
          fi
          # The account id is optional; wrangler finds it from the token when
          # the token can reach only one account.
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then unset CLOUDFLARE_ACCOUNT_ID; fi
          pnpm deploy:workers

      # The query string busts any edge cache, so the check sees this deploy.
      - name: Check the live site
        run: |
          for path in / /data.json; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --retry 3 --retry-delay 5 --retry-all-errors "$SITE_URL$path?deploy=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")
            echo "$SITE_URL$path -> $status"
            if [ "$status" != 200 ]; then
              echo "::error::$SITE_URL$path returned $status"
              exit 1
            fi
          done
